name: publish media to R2

# Uploads the park and ride card photos, the news posts and guides as JSON and the photo index to the R2 bucket behind media.park.fan,
# which the native app reads (PAR-1080, docs/features/media-database.md#export-for-the-native-app).
# Media only ever reaches main through a pull request (the admin and the blog editor commit to
# branches), so a push to main that touches public/media catches every change. Keys carry the
# image version, so a run uploads only what is new; index.json is rewritten every time.

on:
  push:
    branches: [main]
    paths:
      - 'public/media/**'
      - 'content/blog/**'
      - 'scripts/news-export.mjs'
      - 'lib/blog/news-blocks.ts'
      - 'lib/navigation/blog-menu.ts'
      - 'scripts/publish-media-r2.mjs'
  workflow_dispatch:

concurrency:
  group: publish-media
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Backstop for a hang outside the upload step; the upload has its own limit below.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # The crops are not in git, and the manifest only knows a `…-16x9.jpg` cover whose file exists.
      # generate-image-crops keys each crop by its photo's bytes and focal point; the cache hands
      # back the last run's, so only a new or refocused photo is cut again.
      - uses: actions/cache@v6
        with:
          path: .next/cache/image-crops
          key: image-crops-${{ hashFiles('public/media/**') }}
          restore-keys: image-crops-

      - run: pnpm generate:image-crops

      - run: pnpm generate:media

      - run: pnpm generate:blog-manifest

      # A job may run six hours by default, and a run that hangs holds the concurrency group, and every
      # export queued behind it, that long. Fifty minutes is about twice a normal run
      # (docs/features/media-database.md#watching-the-export).
      - name: pnpm publish:media
        id: upload
        timeout-minutes: 50
        run: pnpm publish:media
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # The website shows a post as soon as it deploys; the app and the push notifications get it only
      # from this upload. GitHub's own notice for a red run names the workflow, not that consequence,
      # so the summary and the annotation say what is missing, what is live and how to catch up.
      - name: Say what the app is missing
        if: failure()
        env:
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          if [ "$UPLOAD" = failure ]; then
            state="The upload stopped partway: files written before the error are new, the rest and index.json are still those of the last successful run."
          else
            state="Nothing was uploaded: media.park.fan still serves the export of the last successful run."
          fi
          {
            echo "### The export for the app failed"
            echo
            echo "$state"
            echo
            echo "Until a run succeeds, the app and its push notifications lack posts the website already shows. The admin's System page lists them under „Export für die App“."
            echo
            echo "Start a new run with **Run workflow** on this workflow's page, or \`gh workflow run publish-media.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Export for the app failed::$state Start a new run once the cause is fixed: gh workflow run publish-media.yml"
