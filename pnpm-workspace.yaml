packages:
  - .
overrides:
  postcss: ^8.5.10
  # pnpm audit high advisories, all transitive build/lint tooling:
  # brace-expansion DoS: the 1.x line is clean from 1.1.18 (GHSA-rgw5-rvv9-x895);
  # the 5.x line needs 5.0.12 to cover the parseCommaParts and nested-group stack
  # exhaustion (GHSA-v6h2-p8h4-qcjw family) on top of the earlier quadratic path.
  # js-yaml !!omap quadratic CPU
  # (GHSA-5p4m-2wfm-xmqj), backported to 3.15.1, plus the empty-merge-source
  # CPU DoS (GHSA-2883-xcg3-v3hh) patched in 3.15.2 (via gray-matter>js-yaml);
  # nanoid zero-size loop (GHSA-2v37-7h3g-55p8), patched in 3.3.17.
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.12
  js-yaml@3: ^3.15.2
  # sprintf-js precision-specifier DoS (GHSA-hp3w-g68c-fv3c) has no patched
  # release. It arrives through argparse 1, which only js-yaml's CLI imports, so
  # argparse 2 (no dependencies) drops it without touching the library.
  js-yaml@3>argparse: ^2.0.1
  nanoid@3: ^3.3.17
  # browserslist unbounded memory growth (GHSA-c83g-rgw3-j3cx) and untrusted
  # custom-stats crash/prototype-write (GHSA-73wf-gq98-2v4g), both build-time
  # only (next>styled-jsx>@babel/core), patched on the 4.x line in 4.28.7.
  browserslist@<4.28.7: ^4.28.7
  # markdown-it linkify quadratic CPU (GHSA-mv74-v8hh-5q9p), patched in 14.3.1
  # (via tiptap-markdown in the admin editor).
  markdown-it@14: ^14.3.1
  # undici WebSocket DoS and response-splitting advisories
  # (GHSA-c76h-2ccp-4975 family), patched on the 6.x line in 6.28.1
  # (via @vercel/blob).
  undici@6: ^6.28.1
  # seroval fromJSON() Promise thenable assimilation (patched 1.6.1) and
  # TypedArray memory exhaustion (patched 1.6.3); 1.6.3 covers both. Reached
  # through the React Query devtools (@tanstack/react-query-devtools >
  # @tanstack/query-devtools > solid-js). seroval-plugins tracks the same line.
  seroval@<1.6.3: ^1.6.3
  seroval-plugins@<1.6.3: ^1.6.3
  # source-map-js event-loop DoS (GHSA-vfj7-8cjw-p6xm), patched in 1.2.2,
  # build-time only via beasties > postcss.
  source-map-js@<1.2.2: ^1.2.2
  # zod oversized-collection memory exhaustion (GHSA-mrhx-c7xc-m3w5), patched
  # in 4.6.6. @vercel/cli-config pins zod 4.1.11 exactly (via @vercel/blob >
  # @vercel/oidc), so only an override moves it.
  zod@<4.6.6: ^4.6.7
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  # esbuild ships prebuilt platform binaries; its postinstall only picks one.
  # The render-coaster-elements harness bundles the three.js scene with it.
  esbuild: true
  sharp: false
  unrs-resolver: false
