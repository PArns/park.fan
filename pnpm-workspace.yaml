packages:
  - .
overrides:
  postcss: ^8.5.10
  # pnpm audit high advisories, all transitive build/lint tooling:
  # brace-expansion DoS (GHSA-rgw5-rvv9-x895), patched in 1.1.18 on the 1.x line
  # and 5.0.9 on the 5.x line; js-yaml !!omap quadratic CPU
  # (GHSA-5p4m-2wfm-xmqj), backported to 3.15.1; nanoid zero-size loop
  # (GHSA-2v37-7h3g-55p8), patched in 3.3.17.
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  js-yaml@3: ^3.15.1
  nanoid@3: ^3.3.17
  # browserslist unbounded memory growth (GHSA-c83g-rgw3-j3cx) and untrusted
  # custom-stats crash/prototype-write (GHSA-73wf-gq98-2v4g), both build-time
  # only (next>styled-jsx>@babel/core), patched on the 4.x line in 4.28.7.
  browserslist@<4.28.7: ^4.28.7
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  # esbuild ships prebuilt platform binaries; its postinstall only picks one.
  # The render-coaster-elements harness bundles the three.js scene with it.
  esbuild: true
  sharp: false
  unrs-resolver: false
