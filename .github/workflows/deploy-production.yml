name: deploy production

# A push to main no longer starts a Vercel build (vercel.json, `git.deploymentEnabled`). This
# workflow starts it through a Deploy Hook once main has been quiet for DEPLOY_DEBOUNCE_MINUTES, so
# merges from several sessions in a row become one build instead of one each. The wait happens
# here, not in Vercel's Ignored Build Step, because Vercel bills every minute a build container
# runs, waiting included. See docs/development/deploys.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: Minutes to wait before the deploy hook fires (0 deploys now)
        required: false
        default: '0'

# A new push cancels the run that is still waiting, and its own wait starts over: the debounce.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait until main is quiet
        env:
          EVENT: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_WAIT: ${{ inputs.wait_minutes }}
          DEBOUNCE: ${{ vars.DEPLOY_DEBOUNCE_MINUTES || '10' }}
        run: |
          minutes="$DEBOUNCE"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            minutes="${DISPATCH_WAIT:-0}"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qF '[deploy now]'; then
            minutes=0
          fi
          echo "Deploying ${GITHUB_SHA} after ${minutes} quiet minute(s)."
          sleep "$((minutes * 60))"

      - name: Fire the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PRODUCTION }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_PRODUCTION is not set, so main is not deployed. See docs/development/deploys.md."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 -X POST "$HOOK"
